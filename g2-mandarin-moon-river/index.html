<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="國小二年級下學期國語第七課〈月光河〉互動學習練習頁面。">
    <title>月光河互動小遊戲</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172c34;
        --muted: #5f7076;
        --paper: #f6f0e4;
        --surface: #fffdf7;
        --line: #172c34;
        --river: #1f7a8c;
        --leaf: #4f8f5b;
        --moon: #f0bd55;
        --rose: #c85757;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
        background:
          linear-gradient(rgba(23, 44, 52, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(23, 44, 52, 0.045) 1px, transparent 1px),
          var(--paper);
        background-size: 28px 28px;
      }

      button,
      select {
        font: inherit;
      }

      button {
        min-height: 44px;
        border: 2px solid var(--line);
        background: var(--surface);
        cursor: pointer;
        font-weight: 900;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      select {
        width: 100%;
        min-height: 42px;
        border: 2px solid var(--line);
        background: #fff;
        padding: 0 10px;
        font-weight: 800;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .shell {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 22px 0 34px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 18px;
      }

      .back-link {
        font-weight: 900;
      }

      .progress-note {
        color: var(--muted);
        font-weight: 900;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 390px;
        min-height: 500px;
        border: 2px solid var(--line);
        background: var(--surface);
      }

      .hero-copy {
        align-self: end;
        padding: 34px;
      }

      .hero-image {
        min-height: 500px;
        border-left: 2px solid var(--line);
        background-image: url("../assets/moon-river-hero.jpg");
        background-size: cover;
        background-position: center;
      }

      .label {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 900;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        max-width: 620px;
        margin-bottom: 18px;
        font-size: clamp(3rem, 8vw, 6.3rem);
        line-height: 1;
        letter-spacing: 0;
      }

      .intro {
        max-width: 640px;
        color: #31474e;
        font-size: 1.08rem;
        font-weight: 800;
        line-height: 1.8;
      }

      .start-button,
      .primary {
        background: var(--river);
        color: #fff;
      }

      .start-button {
        min-width: 160px;
        margin-top: 8px;
      }

      .game-layout {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        gap: 18px;
        margin-top: 18px;
      }

      .map,
      .panel,
      .result-panel {
        border: 2px solid var(--line);
        background: var(--surface);
      }

      .map {
        padding: 16px;
      }

      .map h2 {
        margin-bottom: 8px;
        font-size: 1.4rem;
      }

      .stage-list {
        display: grid;
        gap: 8px;
        margin-top: 14px;
      }

      .stage-button {
        display: grid;
        grid-template-columns: 38px 1fr;
        gap: 10px;
        align-items: center;
        width: 100%;
        min-height: 58px;
        text-align: left;
      }

      .stage-button[aria-current="true"] {
        background: #e7f4f1;
      }

      .stage-number {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        background: var(--ink);
        color: #fff;
      }

      .panel,
      .result-panel {
        padding: 22px;
      }

      .panel-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .score {
        color: var(--muted);
        font-weight: 900;
        white-space: nowrap;
      }

      .prompt {
        margin-bottom: 16px;
        padding: 14px;
        border: 2px solid var(--line);
        background: #eef6f4;
        font-weight: 900;
        line-height: 1.7;
      }

      .work {
        display: grid;
        gap: 12px;
      }

      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 220px;
        gap: 12px;
        align-items: center;
        padding: 12px;
        border: 2px solid var(--line);
        background: #fff;
      }

      .choice-grid,
      .word-bank {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
      }

      .choice,
      .word {
        min-height: 48px;
        padding: 8px 12px;
      }

      .choice[aria-pressed="true"],
      .word[aria-pressed="true"] {
        background: var(--moon);
      }

      .answer-line {
        min-height: 58px;
        padding: 12px;
        border: 2px dashed var(--line);
        background: #fff;
        font-weight: 900;
        line-height: 1.8;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }

      .feedback {
        min-height: 28px;
        margin: 14px 0 0;
        color: var(--muted);
        font-weight: 900;
      }

      .feedback.good {
        color: var(--leaf);
      }

      .feedback.bad {
        color: var(--rose);
      }

      .result-panel {
        margin-top: 18px;
      }

      .site-credit {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 2px solid var(--line);
        color: var(--muted);
        font-size: 0.92rem;
        font-weight: 900;
      }

      .site-credit p {
        margin-bottom: 4px;
      }

      @media (max-width: 860px) {
        .hero,
        .game-layout {
          grid-template-columns: 1fr;
        }

        .hero-image {
          min-height: 280px;
          border-top: 2px solid var(--line);
          border-left: 0;
          order: -1;
        }

        .panel-head {
          display: block;
        }
      }

      @media (max-width: 620px) {
        .topbar,
        .row {
          grid-template-columns: 1fr;
        }

        .topbar {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="topbar">
        <a class="back-link" href="../">← 回課程目錄</a>
        <span class="progress-note" id="progress-note">第七課〈月光河〉</span>
      </div>

      <section class="hero" id="hero" aria-labelledby="game-title">
        <div class="hero-copy">
          <p class="label">國小二下國語第七課</p>
          <h1 id="game-title">月光河互動小遊戲</h1>
          <p class="intro">
            以〈月光河〉為素材，練習課文順序、部首、字族、語氣詞、句型與聆聽理解。
          </p>
          <button class="start-button" id="start-button" type="button">開始練習</button>
        </div>
        <div class="hero-image" aria-hidden="true"></div>
      </section>

      <section class="game-layout" id="game-layout" hidden>
        <aside class="map" aria-label="練習關卡">
          <h2>練習關卡</h2>
          <p class="progress-note">完成後可切換下一關。</p>
          <div class="stage-list" id="stage-list"></div>
        </aside>

        <section class="panel" aria-live="polite">
          <div class="panel-head">
            <div>
              <p class="label" id="task-label">任務</p>
              <h2 id="task-title">練習</h2>
            </div>
            <p class="score" id="score">0 / 6</p>
          </div>
          <div class="prompt" id="prompt"></div>
          <div class="work" id="work"></div>
          <p class="feedback" id="feedback"></p>
          <div class="actions">
            <button class="primary" id="check-button" type="button">檢查答案</button>
            <button id="next-button" type="button" disabled>下一關</button>
          </div>
        </section>
      </section>

      <section class="result-panel" id="result-panel" hidden>
        <p class="label">完成</p>
        <h2>第七課練習完成</h2>
        <p id="result-copy"></p>
        <button class="primary" id="restart-button" type="button">重新練習</button>
      </section>

      <footer class="site-credit">
        <p>練習內容依據：國小二年級下學期國語第七課〈月光河〉</p>
        <p>Interactive design by chaohuang-TW</p>
        <p>非官方學習練習頁面</p>
      </footer>
    </main>

    <script>
      const tasks = [
        {
          type: "select",
          label: "關卡一｜故事排序",
          title: "月光河故事順序",
          prompt: "依照課文情節，把事件排成正確順序。",
          summary: "閱讀故事時先找背景，再找事件發生的原因、經過與結果。",
          rows: [
            ["很久以前，有一條月圓時會出現很多月亮的河。", "1"],
            ["月圓那天，小白兔因為生病沒有來。", "2"],
            ["動物們決定去探望小白兔。", "3"],
            ["小白兔可惜自己不能看見月光河。", "4"],
            ["動物們挖坑，請小象把月光河的水吸到院子裡。", "5"],
            ["小池塘裡也有很多月亮，大家度過快樂的夜晚。", "6"]
          ],
          options: ["1", "2", "3", "4", "5", "6"]
        },
        {
          type: "select",
          label: "關卡二｜部首",
          title: "部首辨識",
          prompt: "選出每個生字正確的部首。",
          summary: "部首可以幫助判斷字義，例如疒部常和生病有關。",
          rows: [
            ["祕", "示部"],
            ["猴", "犬部"],
            ["病", "疒部"],
            ["探", "手部"],
            ["體", "骨部"],
            ["請", "言部"]
          ],
          options: ["示部", "犬部", "疒部", "手部", "骨部", "言部"]
        },
        {
          type: "select",
          label: "關卡三｜昔字家族",
          title: "字族填空",
          prompt: "把「昔」加上不同部首，選出句子需要的字。",
          summary: "相同字件加上不同部首，會形成不同的字義。",
          rows: [
            ["阿姨向媽媽__用廚房。", "借"],
            ["她弄__醬油和黑醋。", "錯"],
            ["酸辣湯需要黑__。", "醋"],
            ["可__整鍋湯變鹹辣湯了。", "惜"]
          ],
          options: ["借", "錯", "醋", "惜"]
        },
        {
          type: "choice",
          label: "關卡四｜語氣",
          title: "一定或可能",
          prompt: "讀句子，判斷應該使用「一定」或「可能」。",
          summary: "一定表示很確定，可能表示還不確定。",
          questions: [
            ["哥哥已經報名了，他____會參加說故事比賽。", "一定"],
            ["弟弟還沒決定，他____會參加說故事比賽。", "可能"],
            ["這枝筆太貴了，媽媽____不會買。", "一定"]
          ],
          options: ["一定", "可能"]
        },
        {
          type: "sentence",
          label: "關卡五｜句型",
          title: "除了……都……",
          prompt: "依序點選詞語，組成正確句子。",
          summary: "「除了……都……」先說例外，再說其他人或事的共同情況。",
          answer: ["除了", "文欣", "生病請假", "我們", "都", "參加了運動會"],
          bank: ["都", "生病請假", "文欣", "參加了運動會", "除了", "我們"]
        },
        {
          type: "choice",
          label: "關卡六｜聆聽理解",
          title: "朋友電話任務",
          prompt: "根據朋友打電話關心同學的情境，回答問題。",
          summary: "聆聽時要抓住人物、原因與行動。",
          questions: [
            ["是誰主動打電話給對方？", "家明"],
            ["下課時，家明和智文常一起做什麼？", "跑步"],
            ["家明和智文的感情怎麼樣？", "很好"]
          ],
          options: ["家明", "智文", "跑步", "畫畫", "很好", "普通"]
        }
      ];

      const hero = document.querySelector("#hero");
      const gameLayout = document.querySelector("#game-layout");
      const stageList = document.querySelector("#stage-list");
      const taskLabel = document.querySelector("#task-label");
      const taskTitle = document.querySelector("#task-title");
      const prompt = document.querySelector("#prompt");
      const work = document.querySelector("#work");
      const feedback = document.querySelector("#feedback");
      const score = document.querySelector("#score");
      const checkButton = document.querySelector("#check-button");
      const nextButton = document.querySelector("#next-button");
      const resultPanel = document.querySelector("#result-panel");
      const resultCopy = document.querySelector("#result-copy");
      const startButton = document.querySelector("#start-button");
      const restartButton = document.querySelector("#restart-button");

      let current = 0;
      let completed = new Set();
      let sentenceSelection = [];

      function start() {
        current = 0;
        completed = new Set();
        hero.hidden = true;
        resultPanel.hidden = true;
        gameLayout.hidden = false;
        render();
      }

      function renderStageList() {
        stageList.innerHTML = "";
        tasks.forEach((task, index) => {
          const button = document.createElement("button");
          button.className = "stage-button";
          button.type = "button";
          button.setAttribute("aria-current", index === current ? "true" : "false");
          button.innerHTML = `<span class="stage-number">${index + 1}</span><span>${task.title}</span>`;
          button.addEventListener("click", () => {
            current = index;
            render();
          });
          stageList.appendChild(button);
        });
      }

      function render() {
        const task = tasks[current];
        sentenceSelection = [];
        taskLabel.textContent = task.label;
        taskTitle.textContent = task.title;
        prompt.textContent = task.prompt;
        feedback.textContent = "";
        feedback.className = "feedback";
        checkButton.disabled = false;
        nextButton.disabled = !completed.has(current);
        score.textContent = `${completed.size} / ${tasks.length}`;
        work.innerHTML = "";
        renderStageList();

        if (task.type === "select") renderSelectTask(task);
        if (task.type === "choice") renderChoiceTask(task);
        if (task.type === "sentence") renderSentenceTask(task);
      }

      function renderSelectTask(task) {
        task.rows.forEach(([text]) => {
          const row = document.createElement("label");
          row.className = "row";
          const select = document.createElement("select");
          select.innerHTML = `<option value="">請選擇</option>${task.options.map((option) => `<option>${option}</option>`).join("")}`;
          row.append(text, select);
          work.appendChild(row);
        });
      }

      function renderChoiceTask(task) {
        task.questions.forEach(([text], questionIndex) => {
          const block = document.createElement("div");
          block.className = "row";
          const question = document.createElement("strong");
          const grid = document.createElement("div");
          question.textContent = text;
          grid.className = "choice-grid";
          task.options.forEach((option) => {
            const button = document.createElement("button");
            button.className = "choice";
            button.type = "button";
            button.textContent = option;
            button.dataset.questionIndex = String(questionIndex);
            button.dataset.value = option;
            button.setAttribute("aria-pressed", "false");
            button.addEventListener("click", () => {
              grid.querySelectorAll("button").forEach((item) => item.setAttribute("aria-pressed", "false"));
              button.setAttribute("aria-pressed", "true");
            });
            grid.appendChild(button);
          });
          block.append(question, grid);
          work.appendChild(block);
        });
      }

      function renderSentenceTask(task) {
        const answerLine = document.createElement("div");
        const bank = document.createElement("div");
        answerLine.className = "answer-line";
        bank.className = "word-bank";
        answerLine.textContent = "尚未選擇";

        task.bank.forEach((word) => {
          const button = document.createElement("button");
          button.className = "word";
          button.type = "button";
          button.textContent = word;
          button.setAttribute("aria-pressed", "false");
          button.addEventListener("click", () => {
            if (button.getAttribute("aria-pressed") === "true") return;
            button.setAttribute("aria-pressed", "true");
            sentenceSelection.push(word);
            answerLine.textContent = sentenceSelection.join(" ");
          });
          bank.appendChild(button);
        });

        work.append(answerLine, bank);
      }

      function check() {
        const task = tasks[current];
        let isCorrect = false;

        if (task.type === "select") {
          const selects = [...work.querySelectorAll("select")];
          isCorrect = selects.every((select, index) => select.value === task.rows[index][1]);
        }

        if (task.type === "choice") {
          isCorrect = task.questions.every((question, index) => {
            const selected = work.querySelector(`button[data-question-index="${index}"][aria-pressed="true"]`);
            return selected?.dataset.value === question[1];
          });
        }

        if (task.type === "sentence") {
          isCorrect = sentenceSelection.join("") === task.answer.join("");
        }

        if (isCorrect) {
          completed.add(current);
          feedback.textContent = `答對了。${task.summary}`;
          feedback.className = "feedback good";
          checkButton.disabled = true;
          nextButton.disabled = false;
          score.textContent = `${completed.size} / ${tasks.length}`;
        } else {
          feedback.textContent = "再檢查一次。";
          feedback.className = "feedback bad";
        }
      }

      function next() {
        if (completed.size === tasks.length) {
          finish();
          return;
        }
        current = (current + 1) % tasks.length;
        while (completed.has(current) && completed.size < tasks.length) {
          current = (current + 1) % tasks.length;
        }
        render();
      }

      function finish() {
        gameLayout.hidden = true;
        resultPanel.hidden = false;
        resultCopy.textContent = "已完成〈月光河〉六個練習項目。";
      }

      startButton.addEventListener("click", start);
      restartButton.addEventListener("click", start);
      checkButton.addEventListener("click", check);
      nextButton.addEventListener("click", next);
    </script>
  </body>
</html>
