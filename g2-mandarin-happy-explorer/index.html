      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
        background:
          linear-gradient(180deg, #e6f4f2 0%, #fff7df 52%, #eee8dc 100%);
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 900;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .shell {
        width: min(1180px, calc(100% - 28px));
        margin: 0 auto;
        padding: 22px 0 18px;
      }

      .hero {
        position: relative;
        min-height: 380px;
        overflow: hidden;
        border-radius: 8px;
        background: #1f3f4b;
        box-shadow: var(--shadow);
      }

      .hero::before {
        position: absolute;
        inset: 0;
        content: "";
        background:
          linear-gradient(90deg, rgba(16, 34, 39, 0.88) 0%, rgba(16, 34, 39, 0.58) 42%, rgba(16, 34, 39, 0.08) 78%),
          linear-gradient(180deg, rgba(255, 226, 145, 0.14), rgba(255, 255, 255, 0));

          hint: "找誰、去哪裡、完成什麼。",
          type: "keywords",
          text: "我是快樂的探險家，在森林旅行，在書海航行，在雲端飛行，寫下一頁頁精采的生活日記。",
          groups: [
            { label: "主角身分", answers: ["探險家"], options: ["探險家", "魚兒", "鳥兒", "蝴蝶"] },
            { label: "三個地點", answers: ["森林", "書海", "雲端"], options: ["森林", "書海", "雲端", "草原", "教室"] },
            { label: "完成物品", answers: ["生活日記"], options: ["生活日記", "發明", "歌曲", "葉子"] }
          ]
        },
        {
          id: "radical",
          icon: "部",
          title: "生字能量石",
          kicker: "關卡五｜部首分類",
          promptTitle: "把能量石放回部首充能座",
          promptText: "請將生字配到正確部首。",
          hint: "詩是言部，界是田部，科是禾部，創是刀部，精是米部，航是舟部。",
          type: "match",
          rows: [
            { left: "詩", answer: "言部", options: ["言部", "田部", "禾部", "刀部", "米部", "舟部"] },
            { left: "界", answer: "田部", options: ["言部", "田部", "禾部", "刀部", "米部", "舟部"] },
            { left: "科", answer: "禾部", options: ["言部", "田部", "禾部", "刀部", "米部", "舟部"] },
            { left: "創", answer: "刀部", options: ["言部", "田部", "禾部", "刀部", "米部", "舟部"] },
            { left: "精", answer: "米部", options: ["言部", "田部", "禾部", "刀部", "米部", "舟部"] },
            { left: "航", answer: "舟部", options: ["言部", "田部", "禾部", "刀部", "米部", "舟部"] }
          ]
        },
        {
          id: "stone",
          icon: "碑",
          title: "古老石碑謎題",
          kicker: "關卡六｜動作與事物配對",
          promptTitle: "解開詞語搭配謎題",
          promptText: "把左邊情境接上最適合的動作或事物。",
          hint: "秋天寫詩，春天畫畫；欣賞歌曲，分享故事。",
          type: "match",
          rows: [
            { left: "秋天在葉子上", answer: "寫詩", options: ["寫詩", "畫畫", "歌曲", "故事"] },
            { left: "春天在草原上", answer: "畫畫", options: ["畫畫", "寫詩", "歌曲", "故事"] },
            { left: "欣賞動人的美妙", answer: "歌曲", options: ["歌曲", "故事", "畫畫", "寫詩"] },
            { left: "分享有趣的神奇", answer: "故事", options: ["故事", "歌曲", "畫畫", "寫詩"] }
          ]
        },
        {
          id: "diary",
          icon: "記",
          title: "專屬探險日記",
          kicker: "關卡七｜進階創作",
          promptTitle: "寫下自己的挑戰紀錄",
          promptText: "用你最喜歡的活動，完成一段自己的生活日記。",
          hint: "句子要包含地點或活動、我是什麼人、寫下什麼日記。",
          type: "writing"
        },
        {
          id: "final",
          icon: "測",
          title: "探險家終極測驗",
          kicker: "關卡八｜閱讀理解快問快答",
          promptTitle: "完成總司令口試",
          promptText: "答對四題，就能贏得最終探險家徽章。",
          hint: "蝴蝶森林、魚兒書海、鳥兒雲端、秋天寫詩。",
          type: "quiz",
          rows: [
            { question: "蝴蝶開心地在哪裡飛舞？", answer: "森林", options: ["森林", "書海", "雲端"] },
            { question: "魚兒快活地在哪裡悠遊？", answer: "書海", options: ["書海", "森林", "雲端"] },
            { question: "鳥兒自在地在哪裡追尋？", answer: "雲端", options: ["雲端", "書海", "森林"] },
            { question: "是誰在葉子上寫詩？", answer: "秋天", options: ["秋天", "春天", "魚兒"] }
          ]
        }
      ];

      const storyText = "快樂的探險家出發了。蝴蝶在森林飛舞，看見春天畫畫，也發現秋天在葉子上寫詩。魚兒在書海悠遊，往來古今世界，看見許多科學發明。鳥兒在雲端追尋，欣賞美妙歌曲，分享神奇故事。每一次旅行，都能寫下一頁頁精采的生活日記。";

      const state = {
        index: 0,
        score: 0,
        notes: 0,
        done: new Set()
      };

      let audioContext;
      let storySpeaking = false;

      const els = {
        startBtn: document.querySelector("#startBtn"),
        storyBtn: document.querySelector("#storyBtn"),
        restartBtn: document.querySelector("#restartBtn"),
        gameArea: document.querySelector("#gameArea"),
        finishPanel: document.querySelector("#finishPanel"),
        trail: document.querySelector("#trail"),
        levelKicker: document.querySelector("#levelKicker"),
        levelTitle: document.querySelector("#levelTitle"),
        promptTitle: document.querySelector("#promptTitle"),
        promptText: document.querySelector("#promptText"),
        levelVisual: document.querySelector("#levelVisual"),
        work: document.querySelector("#work"),
        feedback: document.querySelector("#feedback"),
        speakBtn: document.querySelector("#speakBtn"),
        hintBtn: document.querySelector("#hintBtn"),
        checkBtn: document.querySelector("#checkBtn"),
        nextBtn: document.querySelector("#nextBtn"),
        scoreText: document.querySelector("#scoreText"),
        doneText: document.querySelector("#doneText"),
        noteText: document.querySelector("#noteText"),
        finishText: document.querySelector("#finishText"),
        confettiLayer: document.querySelector("#confettiLayer")
      };

      els.startBtn.addEventListener("click", () => {
        document.querySelector(".hero").hidden = true;
        els.finishPanel.hidden = true;
        els.gameArea.hidden = false;
        stopStory();
        renderLevel(0);
      });
      els.storyBtn.addEventListener("click", toggleStory);
      els.restartBtn.addEventListener("click", resetGame);
      els.hintBtn.addEventListener("click", () => setFeedback(levels[state.index].hint, ""));
      els.speakBtn.addEventListener("click", () => speak(`${levels[state.index].promptTitle}。${levels[state.index].promptText}`, "朗讀題目"));
      els.checkBtn.addEventListener("click", checkAnswer);
      els.nextBtn.addEventListener("click", nextLevel);

      function renderLevel(index) {
        state.index = index;
        const level = levels[index];
        els.levelKicker.textContent = level.kicker;
        els.levelTitle.textContent = level.title;
        els.promptTitle.textContent = level.promptTitle;
        els.promptText.textContent = level.promptText;
        els.nextBtn.disabled = true;
        els.checkBtn.disabled = false;
        setFeedback("完成任務後，探險家徽章會亮起來。", "");
        renderTrail();
        renderScore();
        renderLevelVisual(level.id);
        els.work.innerHTML = "";
        if (level.type === "match") renderMatch(level);
        if (level.type === "sentence") renderSentence(level);
        if (level.type === "keywords") renderKeywords(level);
        if (level.type === "writing") renderWriting();
        if (level.type === "quiz") renderQuiz(level);
      }

      function renderTrail() {
        els.trail.innerHTML = "";
        levels.forEach((level, index) => {
          const button = document.createElement("button");
          button.className = "stage-tab";
          if (index === state.index) button.classList.add("is-active");
          if (state.done.has(level.id)) button.classList.add("is-done");
          button.type = "button";
          button.innerHTML = `<span class="badge-icon">${level.icon}</span><span>${level.title}<small>${level.kicker.split("｜")[1]}</small></span><span class="checkmark">${state.done.has(level.id) ? "✓" : ""}</span>`;
          button.addEventListener("click", () => renderLevel(index));
          els.trail.appendChild(button);
        });
      }

      function renderScore() {
        els.scoreText.textContent = state.score;
        els.doneText.textContent = `${state.done.size}/8`;
        els.noteText.textContent = state.notes;
      }

      function renderMatch(level) {
        const list = document.createElement("div");
        list.className = "match-list";
        level.rows.forEach((row, index) => {
          const item = document.createElement("label");
          item.className = "match-row";
          item.innerHTML = `<strong>${row.left}</strong>`;
          item.appendChild(selectFor(row.options, index));
          list.appendChild(item);
        });
        els.work.appendChild(list);
      }

      function renderSentence(level) {
        const box = document.createElement("div");
        box.className = "sentence-list";
        const sample = document.createElement("div");
        sample.className = "keyword-text";
        sample.textContent = "在森林旅行，我是快樂的探險家，寫下精采的生活日記。";
        box.appendChild(sample);
        const row = document.createElement("div");
        row.className = "adventure-card";
        level.rows.forEach((item, index) => {
          const label = document.createElement("label");
          label.innerHTML = `<strong>${item.label}</strong>`;
          label.appendChild(selectFor(item.options, index));
          row.appendChild(label);
        });
        box.appendChild(row);
        els.work.appendChild(box);
      }

      function renderKeywords(level) {
        const wrapper = document.createElement("div");
        wrapper.className = "work";
        const text = document.createElement("div");
        text.className = "keyword-text";
        text.textContent = level.text;
        wrapper.appendChild(text);
        level.groups.forEach((group, groupIndex) => {
          const block = document.createElement("div");
          block.className = "keyword-group";
          block.innerHTML = `<strong>${group.label}</strong>`;
          const chips = document.createElement("div");
          chips.className = "chip-grid";
          group.options.forEach((option) => {
            const chip = document.createElement("button");
            chip.className = "chip";
            chip.type = "button";
            chip.textContent = option;
            chip.dataset.group = groupIndex;
            chip.dataset.value = option;
            chip.setAttribute("aria-pressed", "false");
            chip.addEventListener("click", () => {
              chip.classList.toggle("selected");
              chip.setAttribute("aria-pressed", chip.classList.contains("selected") ? "true" : "false");
            });
            chips.appendChild(chip);
          });
          block.appendChild(chips);
          wrapper.appendChild(block);
        });
        els.work.appendChild(wrapper);
      }

      function renderWriting() {
        const box = document.createElement("div");
        box.className = "work";
        box.innerHTML = `
          <div class="keyword-text">例：在球桌前揮拍，我是身手敏捷的桌球小將，寫下熱血流汗的生活日記。</div>
          <label class="card" style="padding:12px">
            <strong>我的探險日記</strong>
            <textarea id="diaryText" placeholder="在________，我是________的________，寫下________的生活日記。"></textarea>
          </label>
        `;
        els.work.appendChild(box);
      }

      function renderQuiz(level) {
        const list = document.createElement("div");
        list.className = "work";
        level.rows.forEach((row, rowIndex) => {
          const block = document.createElement("div");
          block.className = "keyword-group";
          block.innerHTML = `<strong>${rowIndex + 1}. ${row.question}</strong>`;
          const grid = document.createElement("div");
          grid.className = "choice-grid";
          row.options.forEach((option) => {
            const button = document.createElement("button");
            button.className = "choice";
            button.type = "button";
            button.textContent = option;
            button.dataset.row = rowIndex;
            button.dataset.value = option;
            button.setAttribute("aria-pressed", "false");
            button.addEventListener("click", () => selectChoice(button));
            grid.appendChild(button);
          });
          block.appendChild(grid);
          list.appendChild(block);
        });
        els.work.appendChild(list);
      }

      function selectChoice(button) {
        els.work.querySelectorAll(`[data-row="${button.dataset.row}"]`).forEach((item) => {
          item.setAttribute("aria-pressed", "false");
          item.classList.remove("selected");
        });
        button.setAttribute("aria-pressed", "true");
        button.classList.add("selected");
      }

      function selectFor(options, index) {
        const select = document.createElement("select");
        select.dataset.index = index;
        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "請選擇";
        select.appendChild(placeholder);
        options.forEach((option) => {
          const item = document.createElement("option");
          item.value = option;
          item.textContent = option;
          select.appendChild(item);
        });
        return select;
      }

      function checkAnswer() {
        const level = levels[state.index];
        let correct = false;
        if (["match", "sentence"].includes(level.type)) {
          const selects = [...els.work.querySelectorAll("select")];
          correct = selects.every((select, index) => select.value === level.rows[index].answer);
        }
        if (level.type === "keywords") {
          correct = level.groups.every((group, groupIndex) => {
            const selected = [...els.work.querySelectorAll(`[data-group="${groupIndex}"].selected`)].map((item) => item.dataset.value).sort();
            return selected.join("|") === group.answers.slice().sort().join("|");
          });
        }
        if (level.type === "writing") {
          const text = document.querySelector("#diaryText").value.trim();
          correct = text.length >= 18 && text.includes("我是") && text.includes("寫下") && text.includes("生活日記");
        }
        if (level.type === "quiz") {
          correct = level.rows.every((row, rowIndex) => {
            const selected = els.work.querySelector(`[data-row="${rowIndex}"][aria-pressed="true"]`);
            return selected && selected.dataset.value === row.answer;
          });
        }
        if (correct) completeLevel(level);
        else {
          setFeedback(level.type === "writing" ? "請照句型寫完整，至少包含「我是」、「寫下」和「生活日記」。" : "還差一點，再看看提示或重新調整答案。", "try");
          playTone("wrong");
        }
      }

      function completeLevel(level) {
        if (!state.done.has(level.id)) {
          state.done.add(level.id);
          state.score += 10;
          state.notes += 1;
        }
        setFeedback("答對了！探險筆記更新，徽章亮起來了。", "good");
        els.nextBtn.disabled = false;
        els.checkBtn.disabled = true;
        playTone("correct");
        renderTrail();
        renderScore();
      }

      function nextLevel() {
        const next = levels.findIndex((level) => !state.done.has(level.id));
        if (next === -1) {
          finishGame();
          return;
        }
        renderLevel(next);
      }

      function finishGame() {
        els.gameArea.hidden = true;
        els.finishPanel.hidden = false;
        els.finishText.textContent = `你完成了 ${state.done.size} 個語文試煉，取得 ${state.score} 點探險能量，寫下 ${state.notes} 則探險筆記。你的精采生活日記完成了！`;
        playTone("complete");
        launchConfetti();
      }

      function resetGame() {
        state.index = 0;
        state.score = 0;
        state.notes = 0;
        state.done = new Set();
        stopStory();
        document.querySelector(".hero").hidden = false;
        els.gameArea.hidden = true;
        els.finishPanel.hidden = true;
        renderScore();
      }

      function renderLevelVisual(id) {
        const scenes = {
          roles: ["#cfead8", "#4f8e5b", "森林、書海、雲端", "M90 152 q62 -68 128 0 q62 58 126 -6", "蝴蝶"],
          temple: ["#e5eef8", "#3e79a8", "寺字寶箱", "M82 146 h250", "密碼"],
          report: ["#fff0d2", "#d27c49", "總部回報機", "M104 122 q86 42 184 0", "回報"],
          keywords: ["#e8f4fa", "#328fa5", "尋寶圖筆記", "M72 164 q118 -78 260 0", "關鍵"],
          radical: ["#edf5e9", "#4f8e5b", "生字能量石", "M90 158 h240", "部首"],
          stone: ["#efe8f7", "#7660aa", "古老石碑", "M86 148 q112 -62 244 0", "搭配"],
          diary: ["#fff3dc", "#d27c49", "生活日記", "M90 136 q96 54 218 0", "日記"],
          final: ["#f7e7ee", "#c95d66", "終極測驗", "M86 154 h246", "徽章"]
        };
        const [sky, accent, title, path, tag] = scenes[id] || scenes.roles;
        els.levelVisual.innerHTML = `
          <svg viewBox="0 0 420 210" role="img" aria-label="${title}">
            <rect width="420" height="210" fill="${sky}"/>
            <circle cx="350" cy="44" r="28" fill="#fff4bd" opacity=".92"/>
            <path d="${path}" fill="none" stroke="${accent}" stroke-width="28" stroke-linecap="round" opacity=".28"/>
            <path d="M42 178 q90 -72 196 -4 q78 40 142 0 v36 H42z" fill="#d9bc79"/>
            <rect x="84" y="100" width="86" height="58" rx="8" fill="#fff8e9" stroke="#243238" stroke-width="4"/>
            <path d="M84 103 q42 -34 86 0" fill="none" stroke="#3e79a8" stroke-width="8"/>
            <path d="M232 94 q-28 34 -2 68 q24 -26 54 0 q24 -36 0 -70 q-28 26 -52 2z" fill="${accent}" opacity=".78"/>
            <path d="M303 70 q38 8 58 -12 q-18 40 -58 38z" fill="#fffdf4" stroke="${accent}" stroke-width="6"/>
            <circle cx="122" cy="78" r="18" fill="#f0bd55"/>
            <path d="M111 96 h26 q16 20 12 48 h-50 q-4 -28 12 -48z" fill="#3e79a8"/>
            <text x="34" y="42" fill="#243238" font-size="22" font-weight="900">${title}</text>
            <text x="304" y="178" fill="#243238" font-size="18" font-weight="900">${tag}</text>
          </svg>
        `;
      }

      function toggleStory() {
        if (storySpeaking) {
          stopStory();
          return;
        }
        speak(storyText, "先聽旅程");
      }

      function stopStory() {
        if ("speechSynthesis" in window) speechSynthesis.cancel();
        storySpeaking = false;
        if (els.storyBtn) els.storyBtn.textContent = "先聽旅程";
      }

      function speak(text, idleText) {
        if (!("speechSynthesis" in window)) {
          setFeedback("這個瀏覽器不支援朗讀功能。", "try");
          return;
        }
        speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "zh-TW";
        utterance.rate = 0.92;
        storySpeaking = idleText === "先聽旅程";
        if (storySpeaking) els.storyBtn.textContent = "停止朗讀";
        utterance.onend = () => {
          if (storySpeaking) els.storyBtn.textContent = "先聽旅程";
          storySpeaking = false;
        };
        speechSynthesis.speak(utterance);
      }

      function playTone(type) {
        try {
          audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
          const now = audioContext.currentTime;
          const tones = {
            correct: [523, 659, 784],
            wrong: [220, 174],
            complete: [392, 523, 659, 880]
          }[type] || [440];
          tones.forEach((frequency, index) => {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.frequency.value = frequency;
            osc.type = "sine";
            gain.gain.setValueAtTime(0.0001, now + index * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.13, now + index * 0.08 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.08 + 0.16);
            osc.connect(gain).connect(audioContext.destination);
            osc.start(now + index * 0.08);
            osc.stop(now + index * 0.08 + 0.18);
          });
        } catch {
          // Keep the game playable if sound is blocked.
        }
      }

      function launchConfetti() {
        els.confettiLayer.innerHTML = "";
        const colors = ["#efbd55", "#d27c49", "#3e79a8", "#4f8e5b", "#c95d66"];
        for (let i = 0; i < 58; i += 1) {
          const piece = document.createElement("span");
          piece.className = "confetti";
          piece.style.left = `${Math.random() * 100}%`;
          piece.style.background = colors[i % colors.length];
          piece.style.animationDelay = `${Math.random() * 0.55}s`;
          piece.style.transform = `rotate(${Math.random() * 180}deg)`;
          els.confettiLayer.appendChild(piece);
        }
      }

      function setFeedback(message, type) {
        els.feedback.textContent = message;
        els.feedback.className = `feedback ${type || ""}`.trim();
      }
    </script>
    <script src="../assets/js/course-platform.js"></script>
  </body>
