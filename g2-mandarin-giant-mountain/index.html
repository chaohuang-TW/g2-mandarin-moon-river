<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>巨人山互動練習</title>
    <link rel="stylesheet" href="../assets/css/course-platform.css">
    <style>
      :root {
        color-scheme: light;
        --ink: #263238;
        --muted: #64727a;
        --paper: #fff8e8;
        --panel: #ffffff;
        --line: #d8e2de;
        --sea: #328da2;
        --grass: #5b9c62;
        --gold: #efbd55;
        --blue: #3d78a7;
        --green: #4f8b59;
        --red: #c95d55;
        --purple: #7460aa;
        --stone: #8fa2a7;
        --shadow: 0 18px 42px rgba(38, 50, 56, 0.16);
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
        background: linear-gradient(180deg, #e6f4f2 0%, #fff7df 54%, #eee7dc 100%);
      }

      button, input, textarea, select { font: inherit; }

      button {
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 900;
      }

      button:disabled { cursor: not-allowed; opacity: 0.45; }

      .shell {
        width: min(1180px, calc(100% - 28px));
        margin: 0 auto;
        padding: 22px 0 18px;
      }

      .hero {
        position: relative;
        min-height: 392px;
        overflow: hidden;
        border-radius: 8px;
        background: #214a5d;
        box-shadow: var(--shadow);
      }

      .hero::before {
        position: absolute;
        inset: 0;
        content: "";
        background: linear-gradient(90deg, rgba(22,45,54,0.84) 0%, rgba(22,45,54,0.62) 38%, rgba(22,45,54,0.02) 62%, rgba(22,45,54,0) 100%);
        z-index: 1;
      }

      .hero-scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 62% 50%;
      }

      .hero-scene-svg {
        display: none;
      }

      .hero-copy {
        position: relative;
        z-index: 3;
        max-width: 620px;
        padding: 42px;
        color: #fffdf4;
      }

      .kicker, .mini {
        margin: 0 0 8px;
        color: var(--blue);
        font-size: 0.88rem;
        font-weight: 900;
      }

      .hero .kicker { color: #ffe08a; }

      h1, h2, h3, p { margin-top: 0; }

      h1 {
        max-width: 590px;
        margin-bottom: 12px;
        font-size: 4.35rem;
        line-height: 1.02;
        letter-spacing: 0;
      }

      .hero-copy p {
        max-width: 500px;
        font-size: 1.08rem;
        font-weight: 800;
        line-height: 1.75;
      }

      .hero-copy .primary {
        box-shadow: 0 10px 22px rgba(0,0,0,0.22);
      }

      .mission-peek {
        position: absolute;
        left: auto;
        right: 42px;
        bottom: 14px;
        z-index: 3;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        width: min(720px, calc(100% - 84px));
        pointer-events: none;
      }

      .mission-token {
        display: grid;
        grid-template-columns: 42px 1fr;
        align-items: center;
        gap: 8px;
        min-height: 52px;
        padding: 7px;
        border: 1px solid rgba(255,255,255,0.44);
        border-radius: 8px;
        background: rgba(255,248,232,0.9);
        box-shadow: 0 10px 22px rgba(0,0,0,0.18);
        font-weight: 900;
      }

      .mission-token span:first-child {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 8px;
        color: #fff;
        background: var(--blue);
      }

      .mission-token small {
        display: block;
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 900;
      }

      .mission-token:nth-child(2) span:first-child { background: var(--red); }
      .mission-token:nth-child(3) span:first-child { background: var(--green); }
      .mission-token:nth-child(4) span:first-child { background: var(--purple); }

      .layout {
        display: grid;
        grid-template-columns: 310px minmax(0, 1fr);
        gap: 16px;
        margin-top: 16px;
      }

      .map, .panel {
        border: 2px solid rgba(38,50,56,0.08);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .map { padding: 18px; }
      .map h2 { margin-bottom: 6px; font-size: 1.35rem; }
      .map p { color: var(--muted); font-weight: 800; line-height: 1.55; }

      .trail {
        display: grid;
        gap: 9px;
        margin-top: 16px;
      }

      .stage-tab {
        display: grid;
        grid-template-columns: 38px 1fr auto;
        align-items: center;
        gap: 10px;
        min-height: 56px;
        padding: 8px;
        border: 2px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        color: var(--ink);
        text-align: left;
      }

      .stage-tab.is-active { border-color: var(--blue); background: #e8f4fa; }
      .stage-tab.is-done { border-color: rgba(79,139,89,0.45); background: #edf7ef; }

      .badge-icon {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 8px;
        color: #fff;
        background: var(--blue);
        font-weight: 900;
      }

      .stage-tab small { display: block; color: var(--muted); font-weight: 800; }
      .checkmark { color: var(--green); font-weight: 900; }

      .panel {
        min-height: 620px;
        padding: 24px;
      }

      .panel-head {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 16px;
      }

      .panel-head h2 { margin-bottom: 4px; font-size: 1.75rem; }

      .score {
        display: grid;
        grid-template-columns: repeat(3, minmax(74px, 1fr));
        gap: 8px;
      }

      .score-card {
        min-height: 66px;
        padding: 8px;
        border-radius: 8px;
        background: #f3f0e7;
        text-align: center;
      }

      .score-card strong { display: block; font-size: 1.42rem; line-height: 1.1; }
      .score-card span { color: var(--muted); font-size: 0.82rem; font-weight: 900; }

      .prompt {
        min-height: 94px;
        padding: 16px;
        border: 2px dashed #c8d9df;
        border-radius: 8px;
        background: #f8fbfb;
      }

      .level-visual {
        min-height: 178px;
        margin-bottom: 14px;
        overflow: hidden;
        border: 2px solid rgba(38,50,56,0.08);
        border-radius: 8px;
        background: linear-gradient(135deg, #e8f4fa, #fff8e8);
      }

      .level-visual svg {
        display: block;
        width: 100%;
        height: 178px;
      }

      .level-visual text {
        font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: 0;
      }

      .prompt p { margin-bottom: 0; color: var(--muted); font-weight: 800; line-height: 1.7; }

      .work {
        display: grid;
        gap: 12px;
        margin-top: 16px;
      }

      .match-list { display: grid; gap: 10px; }

      .match-row, .card, .chip {
        border: 2px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
      }

      .match-row {
        display: grid;
        grid-template-columns: 1fr minmax(150px, 260px);
        align-items: center;
        gap: 10px;
        padding: 12px;
      }

      select, input, textarea {
        width: 100%;
        border: 2px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      select, input { min-height: 40px; padding: 0 10px; }
      textarea { min-height: 126px; padding: 10px; resize: vertical; line-height: 1.65; }

      .choice-grid, .chip-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 10px;
      }

      .choice, .chip {
        min-height: 54px;
        padding: 10px 12px;
        color: var(--ink);
        background: #fffdf7;
        text-align: left;
      }

      .choice[aria-pressed="true"], .chip.selected {
        border-color: var(--blue);
        background: #e8f4fa;
      }

      .keyword-group {
        display: grid;
        gap: 10px;
        padding: 12px;
        border: 2px solid var(--line);
        border-radius: 8px;
        background: #f8fbfb;
      }

      .keyword-text {
        padding: 12px;
        border-radius: 8px;
        background: #fffdf7;
        font-weight: 900;
        line-height: 1.7;
      }

      .feedback {
        min-height: 56px;
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 8px;
        background: #f4f0e8;
        color: var(--muted);
        font-weight: 800;
        line-height: 1.6;
      }

      .feedback.good { color: #2c6d45; background: #e8f4ea; }
      .feedback.try { color: #8a5137; background: #fff0e8; }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 16px;
      }

      .primary { padding: 0 18px; color: #fff; background: var(--green); }
      .secondary { padding: 0 18px; color: var(--ink); background: #e8eef0; }
      .gold { color: #3a2c16; background: var(--gold); }

      .site-credit {
        margin: 14px 0 0;
        color: rgba(38,50,56,0.72);
        font-size: 0.86rem;
        font-weight: 800;
        line-height: 1.55;
        letter-spacing: 0;
        text-align: center;
      }

      .site-credit p { margin: 4px 0; }

      @media (max-width: 900px) {
        .shell { width: min(100% - 18px, 680px); padding-top: 10px; }
        .hero { min-height: 550px; }
        .hero::before { background: linear-gradient(180deg, rgba(22,45,54,0.82) 0%, rgba(22,45,54,0.5) 50%, rgba(22,45,54,0.18) 100%); }
        .hero-scene { object-position: 58% 52%; }
        .hero-copy { padding: 30px 24px; }
        h1 { max-width: 330px; font-size: 2.55rem; line-height: 1.1; }
        .hero-copy p { max-width: 330px; }
        .mission-peek {
          left: 14px;
          right: 14px;
          bottom: 14px;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          width: auto;
        }
        .layout { grid-template-columns: 1fr; }
        .map { order: 2; }
        .panel { min-height: auto; padding: 18px; }
        .panel { order: 1; }
        .panel-head { display: grid; }
        .level-visual, .level-visual svg {
          min-height: 150px;
          height: 150px;
        }
        .match-row { grid-template-columns: 1fr; }
      }

      @media (max-width: 560px) {
        h1 { max-width: 285px; font-size: 2.18rem; }
        .hero { min-height: 610px; }
        .hero-copy { padding: 24px 18px; }
        .score { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .choice-grid, .chip-grid { grid-template-columns: 1fr; }
        .mission-peek {
          grid-template-columns: 1fr;
          gap: 7px;
        }
        .mission-token {
          min-height: 48px;
          grid-template-columns: 36px 1fr;
          padding: 6px;
        }
        .mission-token span:first-child {
          width: 36px;
          height: 36px;
        }
      }
    </style>
  </head>

          rows: [

        {
          id: "portrait",
          icon: "寫",
          title: "小人國人物素描",
          kicker: "關卡八｜創意造句大師",
          promptTitle: "完成公主或騎士的文字素描",

          hint: "句子中要出現如、像、和……一樣，才像完整人物素描。",
          type: "writing"

      ];

      const state = { index: 0, score: 0, reports: 0, done: new Set() };

      const els = {
        startBtn: document.querySelector("#startBtn"),
        restartBtn: document.querySelector("#restartBtn"),
        gameArea: document.querySelector("#gameArea"),
        finishPanel: document.querySelector("#finishPanel"),
        trail: document.querySelector("#trail"),
        levelKicker: document.querySelector("#levelKicker"),
        levelTitle: document.querySelector("#levelTitle"),
        levelVisual: document.querySelector("#levelVisual"),
        promptTitle: document.querySelector("#promptTitle"),
        promptText: document.querySelector("#promptText"),
        work: document.querySelector("#work"),
        feedback: document.querySelector("#feedback"),
        hintBtn: document.querySelector("#hintBtn"),
        checkBtn: document.querySelector("#checkBtn"),
        nextBtn: document.querySelector("#nextBtn"),
        scoreText: document.querySelector("#scoreText"),
        doneText: document.querySelector("#doneText"),
        reportText: document.querySelector("#reportText"),
        finishText: document.querySelector("#finishText")
      };

      els.startBtn.addEventListener("click", () => {
        document.querySelector(".hero").hidden = true;
        els.finishPanel.hidden = true;
        els.gameArea.hidden = false;
        renderLevel(0);
      });
      els.restartBtn.addEventListener("click", resetGame);
      els.hintBtn.addEventListener("click", () => setFeedback(levels[state.index].hint, ""));
      els.checkBtn.addEventListener("click", checkAnswer);
      els.nextBtn.addEventListener("click", nextLevel);

      function renderLevel(index) {
        state.index = index;
        const level = levels[index];
        els.levelKicker.textContent = level.kicker;
        els.levelTitle.textContent = level.title;
        els.promptTitle.textContent = level.promptTitle;
        els.promptText.textContent = level.promptText;
        els.nextBtn.disabled = true;
        els.checkBtn.disabled = false;
        setFeedback("完成任務後，小人國報告會更新。", "");
        renderTrail();
        renderScore();
        renderLevelVisual(level);
        els.work.innerHTML = "";
        if (level.type === "quiz") renderQuiz(level);
        if (level.type === "match") renderMatch(level);
        if (level.type === "chips") renderChips(level);
        if (level.type === "writing") renderWriting();
      }

      function renderTrail() {
        els.trail.innerHTML = "";
        levels.forEach((level, index) => {
          const button = document.createElement("button");
          button.className = "stage-tab";
          if (index === state.index) button.classList.add("is-active");
          if (state.done.has(level.id)) button.classList.add("is-done");
          button.type = "button";
          button.innerHTML = `<span class="badge-icon">${level.icon}</span><span>${level.title}<small>${level.kicker.split("｜")[1]}</small></span><span class="checkmark">${state.done.has(level.id) ? "✓" : ""}</span>`;
          button.addEventListener("click", () => renderLevel(index));
          els.trail.appendChild(button);
        });
      }

      function renderScore() {
        els.scoreText.textContent = state.score;
        els.doneText.textContent = `${state.done.size}/8`;
        els.reportText.textContent = state.reports;
      }

      function renderLevelVisual(level) {
        const palette = {
          coast: ["#328da2", "#efbd55", "#fff8e8"],

          food: ["#b77a4b", "#4f8b59", "#fff8e8"],
          reason: ["#3d78a7", "#7460aa", "#fff8e8"],
          pronounce: ["#c95d55", "#3d78a7", "#fff8e8"],
          trap: ["#4f8b59", "#efbd55", "#fff8e8"],
          portrait: ["#7460aa", "#c95d55", "#fff8e8"]
        }[level.id] || ["#3d78a7", "#efbd55", "#fff8e8"];

        const scenes = {

            <path d="M0 136 C120 114 220 156 338 128 C462 100 548 136 640 118 L640 178 L0 178 Z" fill="#f1c987"/>

            <circle cx="252" cy="74" r="5" fill="#253238"/>
            <path d="M280 100 C296 112 314 110 330 96" fill="none" stroke="#6f4638" stroke-width="6" stroke-linecap="round"/>
            <g transform="translate(92 116)">
              <circle cx="0" cy="0" r="10" fill="${accent}"/><path d="M0 10v38M-16 28h32M-10 48h20" stroke="${main}" stroke-width="6" stroke-linecap="round"/>
              <circle cx="58" cy="-10" r="10" fill="${accent}"/><path d="M58 0v44M42 22h32M50 44h20" stroke="#704c34" stroke-width="6" stroke-linecap="round"/>
            </g>
            <text x="466" y="54" fill="${paper}" font-size="28">海邊</text>`,
          body: `
            <rect x="58" y="54" width="150" height="88" rx="14" fill="${paper}" stroke="${main}" stroke-width="5"/>
            <rect x="258" y="54" width="150" height="88" rx="14" fill="${paper}" stroke="${accent}" stroke-width="5"/>
            <rect x="458" y="54" width="120" height="88" rx="14" fill="${paper}" stroke="${main}" stroke-width="5"/>

          language: `

            <path d="M140 68 C168 34 220 38 244 70" fill="none" stroke="#4a342b" stroke-width="12" stroke-linecap="round"/>
            <circle cx="170" cy="88" r="6" fill="#253238"/><circle cx="212" cy="88" r="6" fill="#253238"/>
            <path d="M180 116 C196 126 212 124 226 114" fill="none" stroke="#6f4638" stroke-width="6" stroke-linecap="round"/>
            <path d="M282 58 h190 q28 0 28 28 v48 q0 28 -28 28 h-128 l-46 34 v-34 h-16 q-28 0 -28 -28 v-48 q0 -28 28 -28z" fill="${paper}" stroke="${main}" stroke-width="5"/>
            <text x="326" y="116" fill="${accent}" font-size="34">哈...媽...</text>`,

            <g transform="translate(70 72)">
              <rect x="0" y="20" width="72" height="78" rx="10" fill="#9a6439" stroke="#5d3c2c" stroke-width="5"/>

              <rect x="216" y="28" width="72" height="70" rx="10" fill="#9a6439" stroke="#5d3c2c" stroke-width="5"/>

            </g>

          reason: `
            <path d="M80 142 L190 42 L300 142 Z" fill="${main}" opacity=".22" stroke="${main}" stroke-width="5"/>
            <text x="126" y="124" fill="${main}" font-size="28">像山</text>
            <rect x="334" y="44" width="196" height="112" rx="14" fill="${paper}" stroke="${accent}" stroke-width="5"/>
            <text x="372" y="82" fill="${accent}" font-size="24">聽不懂</text>
            <text x="374" y="120" fill="${main}" font-size="24">吃很多</text>
            <circle cx="562" cy="52" r="24" fill="${accent}" opacity=".75"/>`,

            <rect x="70" y="48" width="206" height="110" rx="16" fill="${paper}" stroke="${main}" stroke-width="5"/>

            <text x="118" y="92" fill="${main}" font-size="34">累</text>
            <text x="102" y="132" fill="${main}" font-size="22">ㄌㄟˇ / ㄌㄟˋ</text>
            <text x="398" y="92" fill="${accent}" font-size="34">倒</text>
            <text x="382" y="132" fill="${accent}" font-size="22">ㄉㄠˋ / ㄉㄠˇ</text>
            <path d="M300 104h38" stroke="${main}" stroke-width="10" stroke-linecap="round"/>`,
          trap: `
            <path d="M84 44 h440 v34 h-360 v36 h360 v34 h-440 z" fill="none" stroke="${main}" stroke-width="10" stroke-linejoin="round"/>
            <circle cx="116" cy="60" r="18" fill="${accent}"/><circle cx="514" cy="132" r="18" fill="${accent}"/>
            <text x="196" y="102" fill="${main}" font-size="30">島</text>
            <text x="286" y="102" fill="${accent}" font-size="30">倒</text>

            <circle cx="154" cy="76" r="34" fill="#f2c67f" stroke="${main}" stroke-width="5"/>

        };

            ${scenes[level.id]}
          </svg>`;
      }

      function renderQuiz(level) {
        const list = document.createElement("div");
        list.className = "work";
        level.rows.forEach((row, rowIndex) => {
          const block = document.createElement("div");
          block.className = "keyword-group";
          block.innerHTML = `<strong>${rowIndex + 1}. ${row.question}</strong>`;
          const grid = document.createElement("div");
          grid.className = "choice-grid";
          row.options.forEach((option) => {
            const button = document.createElement("button");
            button.className = "choice";
            button.type = "button";
            button.textContent = option;
            button.dataset.row = rowIndex;
            button.dataset.value = option;
            button.setAttribute("aria-pressed", "false");
            button.addEventListener("click", () => selectChoice(button));
            grid.appendChild(button);
          });
          block.appendChild(grid);
          list.appendChild(block);
        });
        els.work.appendChild(list);
      }

      function selectChoice(button) {
        els.work.querySelectorAll(`[data-row="${button.dataset.row}"]`).forEach((item) => {
          item.setAttribute("aria-pressed", "false");
          item.classList.remove("selected");
        });
        button.setAttribute("aria-pressed", "true");
        button.classList.add("selected");
      }

      function renderMatch(level) {
        const list = document.createElement("div");
        list.className = "match-list";
        level.rows.forEach((row, index) => {
          const item = document.createElement("label");
          item.className = "match-row";
          item.innerHTML = `<strong>${row.left}</strong>`;
          item.appendChild(selectFor(row.options, index));
          list.appendChild(item);
        });
        els.work.appendChild(list);
      }

      function renderChips(level) {
        const wrapper = document.createElement("div");
        wrapper.className = "work";
        level.groups.forEach((group, groupIndex) => {
          const block = document.createElement("div");
          block.className = "keyword-group";
          block.innerHTML = `<strong>${group.label}</strong>`;
          const chips = document.createElement("div");
          chips.className = "chip-grid";
          group.options.forEach((option) => {
            const chip = document.createElement("button");
            chip.className = "chip";
            chip.type = "button";
            chip.textContent = option;
            chip.dataset.group = groupIndex;
            chip.dataset.value = option;
            chip.setAttribute("aria-pressed", "false");
            chip.addEventListener("click", () => {
              chip.classList.toggle("selected");
              chip.setAttribute("aria-pressed", chip.classList.contains("selected") ? "true" : "false");
            });
            chips.appendChild(chip);
          });
          block.appendChild(chips);
          wrapper.appendChild(block);
        });
        els.work.appendChild(wrapper);
      }

      function renderWriting() {
        const box = document.createElement("div");
        box.className = "work";
        box.innerHTML = `
          <div class="keyword-text">例：騎士的力氣如強大的野熊，寶劍像閃電，跑起來和一陣風一樣。</div>
          <label class="card" style="padding:12px">
            <strong>我的人物素描</strong>
            <textarea id="portraitText" placeholder="請描寫小人國公主或騎士，使用「如」、「像」、「和……一樣」。"></textarea>
          </label>
        `;
        els.work.appendChild(box);
      }

      function selectFor(options, index) {
        const select = document.createElement("select");
        select.dataset.index = index;
        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = "請選擇";
        select.appendChild(placeholder);
        options.forEach((option) => {
          const item = document.createElement("option");
          item.value = option;
          item.textContent = option;
          select.appendChild(item);
        });
        return select;
      }

      function checkAnswer() {
        const level = levels[state.index];
        let correct = false;
        if (level.type === "quiz") {
          correct = level.rows.every((row, rowIndex) => {
            const selected = els.work.querySelector(`[data-row="${rowIndex}"][aria-pressed="true"]`);
            return selected && selected.dataset.value === row.answer;
          });
        }
        if (level.type === "match") {
          const selects = [...els.work.querySelectorAll("select")];
          correct = selects.every((select, index) => select.value === level.rows[index].answer);
        }
        if (level.type === "chips") {
          correct = level.groups.every((group, groupIndex) => {
            const selected = [...els.work.querySelectorAll(`[data-group="${groupIndex}"].selected`)].map((item) => item.dataset.value).sort();
            return selected.join("|") === group.answers.slice().sort().join("|");
          });
        }
        if (level.type === "writing") {
          const text = document.querySelector("#portraitText").value.trim();
          correct = text.length >= 24 && text.includes("如") && text.includes("像") && text.includes("和") && text.includes("一樣");
        }
        if (correct) completeLevel(level);
        else setFeedback(level.type === "writing" ? "請寫出完整人物素描，並使用「如」、「像」、「和……一樣」。" : "還差一點，再看看提示或重新調整答案。", "try");
      }

      function completeLevel(level) {
        if (!state.done.has(level.id)) {
          state.done.add(level.id);
          state.score += 10;
          state.reports += 1;
        }
        setFeedback("答對了！小人國報告更新，勇士徽章亮起來了。", "good");
        els.nextBtn.disabled = false;
        els.checkBtn.disabled = true;
        renderTrail();
        renderScore();
      }

      function nextLevel() {
        const next = levels.findIndex((level) => !state.done.has(level.id));
        if (next === -1) {
          finishGame();
          return;
        }
        renderLevel(next);
      }

      function finishGame() {
        els.gameArea.hidden = true;
        els.finishPanel.hidden = false;
        els.finishText.textContent = `你完成了 ${state.done.size} 個語文試煉，取得 ${state.score} 點勇氣，寫下 ${state.reports} 份小人國報告。國王宣布：你就是巨人山調查勇士！`;
      }

      function resetGame() {
        state.index = 0;
        state.score = 0;
        state.reports = 0;
        state.done = new Set();
        document.querySelector(".hero").hidden = false;
        els.gameArea.hidden = true;
        els.finishPanel.hidden = true;
        renderScore();
      }

      function setFeedback(message, type) {
        els.feedback.textContent = message;
        els.feedback.className = `feedback ${type || ""}`.trim();
      }
    </script>
    <script src="../assets/js/course-platform.js"></script>
  </body>
</html>
